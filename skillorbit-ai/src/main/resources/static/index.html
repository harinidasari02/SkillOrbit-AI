<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkillOrbit AI</title>
<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#f5f6f8;color:#1c2330}
 header{background:#1c2330;color:#fff;padding:14px 24px} main{max-width:1000px;margin:20px auto;padding:0 16px}
 .card{background:#fff;border-radius:8px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px #0002}
 select,button{font:inherit;padding:6px 10px} button{cursor:pointer}
 table{width:100%;border-collapse:collapse;font-size:14px} td,th{padding:6px 8px;border-bottom:1px solid #e3e6eb;text-align:left}
 .ok{color:#127a3a;font-weight:600}.no{color:#b3261e;font-weight:600} small{color:#5b6573} pre{white-space:pre-wrap;margin:6px 0 0}
</style></head><body>
<header><b>SkillOrbit AI</b> &mdash; rule-based skill-gap recommendations <small style="color:#aab">(Ollama only explains)</small></header>
<main>
 <div class="card" id="status">Loading dataset status&hellip;</div>
 <div class="card">
  <label>Employee <select id="emp"></select></label> <button onclick="load()">Show gaps &amp; recommendations</button>
  <div id="out"></div>
 </div>
</main>
<script>
const $=id=>document.getElementById(id);
const j=async u=>{const r=await fetch(u);if(!r.ok)throw new Error((await r.json().catch(()=>({}))).message||r.status);return r.json();};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function init(){
  try{
    const v=await j('/api/admin/validation'), m=await j('/api/admin/metrics');
    const g=m.gaps_and_coverage, r=m.rule_engine_vs_ground_truth;
    $('status').innerHTML=`Dataset validation: <span class="${v.ok?'ok':'no'}">${v.passed} passed, ${v.failed} failed</span> &middot; open gaps ${g.open_skill_gaps}, gap coverage ${(g.gap_coverage_rate*100).toFixed(1)}% &middot; rule engine vs ground truth ${(r.rule_engine_accuracy_vs_ground_truth*100).toFixed(1)}%`;
    const es=await j('/api/employees?limit=50');
    $('emp').innerHTML=es.map(e=>`<option value="${e.employeeId}">${e.employeeId} - ${esc(e.fullName)} (${esc(e.role)})</option>`).join('');
  }catch(e){$('status').innerHTML=`<span class="no">${esc(e.message)}</span> &mdash; generate data first: <code>POST /api/admin/generate-dataset?scale=starter</code>`;}
}
async function load(){
  const id=$('emp').value; $('out').innerHTML='Loading&hellip;';
  try{
    const recs=await j(`/api/employees/${id}/recommendations?perSkill=3`);
    $('out').innerHTML=recs.length?recs.map(r=>`<h4>${esc(r.skillName)} <small>${r.current} &rarr; target ${r.target} (gap ${r.gap})</small></h4>`+
      (r.feasible.length?`<table><tr><th>Course</th><th>Cost</th><th>Teaches up to</th><th>Why</th><th></th></tr>`+
      r.feasible.map(c=>`<tr><td>${c.courseId} ${esc(c.courseName)}</td><td>${c.cost}</td><td>L${c.levelTaught}</td><td>${esc(c.reason)}</td>
        <td><button onclick="explain('${id}','${r.skillId}','${c.courseId}',this)">Explain</button><pre></pre></td></tr>`).join('')+`</table>`
      :'<small>No feasible course.</small>')+
      `<small>Rejected ${r.rejectedCount}: ${esc(JSON.stringify(r.rejectedByReason))}</small>`).join(''):'No open gaps.';
  }catch(e){$('out').innerHTML=`<span class="no">${esc(e.message)}</span>`;}
}
async function explain(e,s,c,btn){
  const pre=btn.nextElementSibling; pre.textContent='Asking Ollama (falls back to rule text if unavailable)…';
  const x=await j(`/api/employees/${e}/skills/${s}/courses/${c}/explanation`);
  pre.textContent=x.explanation+'\n['+x.explanationSource+']';
}
init();
</script></body></html>
