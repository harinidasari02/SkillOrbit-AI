spring.application.name=skillorbit-ai
server.port=8080
server.error.include-message=always
server.error.include-stacktrace=never

# Ollama is optional and only phrases explanations; every decision comes from the rule engine.
ollama.api-url=${OLLAMA_API_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:llama3.2:3b}

# Dataset directory = <root>/<scale>. Seed and scale of the generator are fixed in code (see README).
skillorbit.dataset.root=${DATASET_ROOT:synthetic-output}
skillorbit.dataset.scale=${DATASET_SCALE:starter}
